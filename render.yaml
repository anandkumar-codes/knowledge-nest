# Render blueprint: one free web service that builds the React app and runs the API, which also serves the app.
# The data lives in Turso (set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the Render dashboard).
services:
  - type: web
    name: knowledge-nest
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm --prefix server ci && npm run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Render's proxy adds the visitor's real address; trust exactly that one hop.
      - key: TRUST_PROXY
        value: "1"
